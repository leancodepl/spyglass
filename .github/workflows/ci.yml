name: CI

on:
  pull_request:

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [format, analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run melos run ${{ matrix.task }}
